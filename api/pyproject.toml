[project]
name = "cabshare-api"
version = "0.1.0"
description = "CabShare ride-pairing backend (MVP)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "apscheduler>=3.10",
    "pydantic>=2.8",
    "alembic>=1.13",
    "cryptography>=43.0",
    "twilio>=9.0",
    "httpx>=0.27",
    "truststore>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "truststore>=0.9",
    "ruff>=0.6",
    "black>=24.8",
]

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
